name: clang-tidy Job

on:
  workflow_call:
    inputs:
      pr_id:
        required: false
        type: string
        default: ${{ atomgit.event.pull_request.number }}
      CP_DOCKER_IMG:
        required: true
        type: string
      runs_on_arch:
        required: false
        type: string
        default: "x64"
      runs_on_spec:
        required: false
        type: string
        default: "cpu=32"
      REMOTE_URL:
        required: false
        type: string
        default: ${{ env.ATOMGIT_REPOSITORY_URL }}

jobs:
  Compile:
    name: clang-tidy
    select: selected_by_default
    runs-on: [ self-hosted,"${{ inputs.runs_on_arch }}", "${{ inputs.runs_on_spec }}" ]
    container:
      image: ${{ inputs.CP_DOCKER_IMG }}
    steps:
      - name: checkout DrivingSDK
        uses: checkout
        with:
          ref: refs/merge-requests/${{ inputs.pr_id }}/merge
          fetch-depth: 1
          path: CODE
          allow-unsafe-pr-checkout: true

      - name: download modify_files.txt artifact
        uses: download-artifact
        with:
          name: modify_files.txt
          path: ./

      - name: clang-tidy
        run: |
          cd CODE
          if [ ! -f ".pre-commit-config.yaml" ] || [ ! -f ".clang-tidy" ]; then
              echo "缺少 .pre-commit-config.yaml 或 .clang-tidy，跳过clang-tidy代码检查，直接成功"
              exit 0
          fi
          cd -
          git clone -b ${{ atomgit.event.repository.default_branch }} ${{ inputs.REMOTE_URL }} cie
          cd cie/.gitcode/workflows/scripts
          bash DrivingSDK_build.sh ${ATOMGIT_WORKSPACE} ${{inputs.pr_id}}
          ls ${ATOMGIT_WORKSPACE}
          
          # 读取变更文件列表
          cd ${ATOMGIT_WORKSPACE}
          MODIFY_FILE="modify_files.txt"
          FILE_ARRAY=()
          exec 3< "${MODIFY_FILE}"
          while IFS= read -r raw_line <&3 || [[ -n "${raw_line}" ]]; do
              fp=$(echo "${raw_line}" | sed -e 's/^"//' -e 's/"$//' -e 's/^[ \t]*//' -e 's/[ \t]*$//')
              if [[ -n "${fp}" ]]; then
                  FILE_ARRAY+=("${fp}")
              fi
          done
          exec 3<&-

          # 过滤只保留源码文件传入检测
          CHECK_ARRAY=()
          for file in "${FILE_ARRAY[@]}"; do
              if [[ "${file}" =~ [.](cpp|cc|cxx|c)$ ]]; then
                  CHECK_ARRAY+=("${file}")
              fi
          done

          echo "===== 开始安装clang与pre-commit并执行静态检测 ====="
          # 离线安装clang工具包
          wget --no-host-directories -c --no-check-certificate https://pytorch-package.obs.cn-north-4.myhuaweicloud.com/pta-codecheck/clang-tools-extra-llvm21.1.8-hce2-x86_64.tar.gz
          mkdir -p clang-tools
          tar -zxvf clang-tools-extra-llvm21.1.8-hce2-x86_64.tar.gz -C ./clang-tools
          dnf localinstall --disablerepo=* -C ./clang-tools/*.rpm -y
          export PATH=$PATH:/usr/lib/llvm21/bin
          clang-tidy --version

          # 安装pre-commit
          pip3.10 config set global.index-url https://mirrors.huaweicloud.com/repository/pypi/simple
          pip3.10 install --upgrade pip setuptools wheel --no-cache-dir
          python3.10 -m pip install pre-commit==4.5.1

          cd ./CODE
          echo "待检测C/C++源文件总数：${#CHECK_ARRAY[@]}"
          for single_file in "${CHECK_ARRAY[@]}"; do
              echo "----------------------------------------"
              echo "正在检测文件：${single_file}"
              ls -a
              find -name "compile_"
              python3.10 -m pre_commit run clang-tidy --files "${single_file}" </dev/null
              ret=$?
              if [[ ${ret} -ne 0 ]]; then
                  echo "ERROR: 文件 ${single_file} clang-tidy 检测不通过"
                  exit ${ret}
              fi
          done
          echo "===== 全部源文件clang-tidy检测完成 ====="
