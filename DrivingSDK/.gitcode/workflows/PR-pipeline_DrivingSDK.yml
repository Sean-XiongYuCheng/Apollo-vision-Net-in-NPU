name: PR-pipeline_DrivingSDK

concurrency:
  max: 120
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

on:
  pr_comment:
    types: [created]
    keyword: "^compile$"

  pull_request_comment:
    types: [created]
    branches: ["master", "branch_v26.2.0", "branch_v26.1.0"]
    comments: ["^compile$"]

env:
  repo: ${{ atomgit.event.repository.name }}
  pr_id: ${{ atomgit.event.pull_request.number }}
  target_branch: ${{ atomgit.event.pull_request.base.ref }}
  org_name: "Ascend"

permissions:
  project: read
  repository: read
  id-token: write
  pr: write
  note: write
  action: read

stages:
  stage_1:
    name: only_doc
    jobs:
      Detect_file_changes:
        name: Detect_file_changes
        runs-on: [self-hosted, default, x86, cpu=16]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/pytorch_images_x86/pytorchx86:v_03
        outputs:
          need_build_ut: ${{ steps.set-skip.outputs.need_build_ut }}
          run_build_ut: ${{ steps.set-skip.outputs.run_build_ut }}
          run_clang_tidy: ${{ steps.set-skip.outputs.run_clang_tidy }}
        steps:
          - name: checkout
            uses: checkout
            with:
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              fetch-depth: 0
              allow-unsafe-pr-checkout: true
          - name: Only_doc_commit
            id: filter
            uses: paths-changes-filter
            with:
              event-name: "pull_request"
              base: ${{ atomgit.event.pull_request.base.ref }}
              repo: ${{ atomgit.repository }}
              number: ${{ env.pr_id }}
              token: ${{ secrets.GIT_TOKEN }}
              list-files: json
              predicate-quantifier: every
              filters: |
                changed:
                  - '**'
                non-doc:
                  - '!**/*.md'
                  - '!**/*.rst'
                  - '!**/*.log'
                  - '!**/*.png'
                  - '!**/*.jpg'
                  - '!**/*.doc'
                  - '!**/*.eddx'
                  - '!**/*.svg'
                build:
                  - 'README*'
                  - 'docs/**'
                  - 'model_examples/**'
                  - 'Third_Party_Open_Source_Software_Notice*'

          - name: set build skip flag
            id: set-skip
            run: |
              echo "changed: ${{ steps.filter.outputs.changed_files }}"
              echo "non-doc: ${{ steps.filter.outputs.non-doc }}"
              if [ "${{ steps.filter.outputs.non-doc }}" = "true" ]; then
                  echo "need_build_ut=yes" >> "$ATOMGIT_OUTPUT"
              else
                  echo "need_build_ut=no" >> "$ATOMGIT_OUTPUT"
              fi
              echo "run_build_ut=yes" >> "$ATOMGIT_OUTPUT"
              if [ "${{ steps.filter.outputs.build }}" = "true" ]; then
                  echo "run_build_ut=no" >> "$ATOMGIT_OUTPUT"
              fi
              echo "${{ steps.filter.outputs.changed_files }}" | tr -d '[]" ' | tr ',' '\n' > modify_files.txt
              run_clang_tidy="no"
              if [ "${{ steps.filter.outputs.non-doc }}" = "true" ] && [ "${{ steps.filter.outputs.build }}" != "true" ] && grep -qE '[.](cpp|cc|cxx|c)$' ./modify_files.txt; then
                  run_clang_tidy="yes"
              fi
              echo "run_clang_tidy=$run_clang_tidy" >> "$ATOMGIT_OUTPUT"
              echo "run_clang_tidy: $run_clang_tidy"
              cat modify_files.txt

          - name: upload modify_files.txt
            uses: upload-artifact
            with:
              name: modify_files.txt
              path: modify_files.txt
              overwrite: true

      associate_pr_comment:
        name: associate_pr_comment
        select: selected_by_default
        runs-on: [ self-hosted, default, x86, cpu=16 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/pytorch_images_x86/pytorchx86:v_03
        steps:
          - name: associate-pr-comment
            uses: associate-pr-comment
          - name: pre_pipeline
            id: pre_pipeline
            uses: cann/.gitcode/actions/pre-pipeline@689551d6b29a77d8c2a005b8f1b3883db24820ef
            with:
              owner: ${{ env.org_name }}
              repo: ${{ atomgit.event.repository.name }}
              pr_number: ${{ atomgit.event.pull_request.number }}
              token: ${{ secrets.GIT_TOKEN }}
              apply_label: 'true'
              run_url: https://gitcode.com/${{ env.org_name }}/${{ atomgit.event.repository.name }}/actions/runs/${{ atomgit.workflow_run_id }}

  stage_2:
    name: CodeCheck
    select: selected_by_default
    jobs:
      CodeCheck_pre_commit:
        name: pre-commit
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        runs-on: [ self-hosted, default, x86, cpu=16 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/atlas-ci/common:latest
        steps:
          - name: checkout
            uses: checkout
            with:
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              allow-unsafe-pr-checkout: true
          - name: setup-python311
            run: |
              PYTHON311_BIN=$(dirname "$(which python3.11)")
              ln -sf "$(which python3.11)" "$PYTHON311_BIN/python"
              echo "$PYTHON311_BIN" >> "$ATOMGIT_PATH"
              python --version
          - name: install gitleaks
            run: |
              cd ${ATOMGIT_WORKSPACE}
              wget --no-host-directories -c --no-check-certificate https://pytorch-package.obs.cn-north-4.myhuaweicloud.com/pta-codecheck/gitleaks
              chmod +x gitleaks
              cd -
          - name: Run pre-commit
            uses: openlibing/pre-commit-action@v1.0.0
            env:
              SKIP: clang-tidy

      sca-pr:
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        runs-on: [ self-hosted, default, x86, cpu=16 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/pytorch_images_x86/pytorchx86:v_03
        steps:
          - name: checkout
            uses: checkout
          - name: Run SCA PR scan
            uses: openlibing/sca-action/sca-pr-action@v1.0.0
            with:
              project-name: MindSpeed

      malicious-scan:
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        runs-on: [ self-hosted, default, x86, cpu=16 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/pytorch_images_x86/pytorchx86:v_03
        steps:
          - name: checkout
            uses: checkout
          - name: Run malicious code scan
            uses: openlibing/malicious-code-scan-action/malicious-code-pr-scan-action@v1.0.0
            with:
              repository-name: ${{ atomgit.repository }}
              pr-id: "${{ atomgit.event.pull_request.number }}"
              project-name: MindSpeed

  stage_3:
    name: Buld and UT
    select: selected_by_default
    jobs:
      Build_x86:
        name: Build_x86
        select: selected_by_default
        if: ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && jobs.Detect_file_changes.outputs.run_build_ut == 'yes'}}
        uses: .gitcode/workflows/build_job.yml
        with:
          CP_DOCKER_IMG: "swr.cn-north-4.myhuaweicloud.com/mindspeed/drivingsdk_x86:cann8.5.0"
          runs_on_arch: "x86"
          runs_on_spec: "cpu=32"

      Build_arm:
        name: Build_arm
        select: selected_by_default
        if: ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && jobs.Detect_file_changes.outputs.run_build_ut == 'yes'}}
        uses: .gitcode/workflows/build_job.yml
        with:
          CP_DOCKER_IMG: "swr.cn-north-4.myhuaweicloud.com/mindspeed/drivingsdk_arm:cann8.5.0"
          runs_on_arch: "arm"
          runs_on_spec: "cpu=32"

      UT:
        name: UT
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && jobs.Detect_file_changes.outputs.run_build_ut == 'yes'}}
        needs: Build_arm
        uses: .gitcode/workflows/ut_job.yml
        with:
          CP_DOCKER_IMG: "swr.cn-north-4.myhuaweicloud.com/mindspeed/pr-drivingsdk:cann9.1.0-torch_2.1-910b-openeuler24.03-py3.8-aarch64-0818"

      clang-tidy:
        name: clang-tidy
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && jobs.Detect_file_changes.outputs.run_clang_tidy == 'yes'}}
        uses: .gitcode/workflows/clang-tidy_job.yml
        with:
          CP_DOCKER_IMG: "swr.cn-north-4.myhuaweicloud.com/mindspeed/drivingsdk_x86:cann8.5.0"
          runs_on_arch: "x86"
          runs_on_spec: "cpu=32"

post:
  jobs:
    query_pipeline:
      steps:
        - name: query_pipeline
          id: query_pipeline
          uses: cann/.gitcode/actions/query-pipeline@689551d6b29a77d8c2a005b8f1b3883db24820ef
          with:
            owner: ${{ env.org_name }}
            repo: ${{ atomgit.event.repository.name }}
            run_id: ${{ atomgit.workflow_run_id }}
            token: ${{ secrets.GIT_TOKEN }}
            pr_number: ${{ atomgit.event.pull_request.number }}
            apply_label: 'true'
