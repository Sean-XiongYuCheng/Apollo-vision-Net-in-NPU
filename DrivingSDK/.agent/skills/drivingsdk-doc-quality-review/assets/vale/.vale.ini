# Vale 配置（doc-quality-review skill 的 terminology 道）
# 用法：vale --config <此文件> <markdown 文件...>
# StylesPath 相对本文件目录解析。
StylesPath = styles
MinAlertLevel = suggestion
# 注：当前仅启用术语替换规则(Terms.yml)，未启用 Vale 拼写规则，故不设 Vocab。
# 若将来启用 Vale.Spelling 类规则，再加 `Vocab = DrivingSDK` 并把 ../domain_terms.txt
# 同步到 styles/config/vocabularies/DrivingSDK/accept.txt。

[*.md]
BasedOnStyles = DrivingSDK
